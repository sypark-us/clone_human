function act(k,i){if(!k)return;s.counts[k]=(s.counts[k]||0)+1;s.metrics[k].activations++;if(k==='mine'){const n=4+bonus('mine',i);s.energy+=n;s.metrics[k].energy+=n;}if(k==='clone'&&s.energy>=4+(s.enemyType?.id==='jam'?2:0)){s.energy-=4+(s.enemyType?.id==='jam'?2:0);{const n=2+bonus('clone',i);s.units+=n;s.metrics[k].clones+=n;event('clone',n,k)}}if(k==='soldier'&&s.energy>=3+(s.enemyType?.id==='jam'?2:0)){s.energy-=3+(s.enemyType?.id==='jam'?2:0);s.units++;s.metrics[k].clones++;event('clone',1,k)}if(k==='mutation'&&s.energy>=5){s.energy-=5;s.attack+=2+bonus('mutation',i);s.metrics[k].power+=2+bonus('mutation',i)}if(k==='bomb'){let n=Math.min(2,s.units);s.units-=n;if(n){event('damage',Math.round(14*n*(s.enemyType?.id==='armor'?.4:1)*(bonus('bomb',i)||1)),k);event('bomb',n,k)}}if((k==='echo'||k==='boost')&&i>0){let p=s.slots[i-1];if(p&&p!=='echo'&&p!=='boost')for(let j=0;j<Math.max(0,(k==='echo'?2:1)-(s.enemyType?.id==='disrupt'?1:0));j++)act(p,i-1)}}

function end(win){clearInterval(timer);s.playing=false;if(win)s.energy+=s.objective.id==='rush'?12:s.objective.id==='survive'?10:3;s.report={win,wave:s.wave,enemy:s.enemyType?.name,turns:s.turn,damage:s.max-s.hp,events:s.eventsTotal,peak:s.chainPeak,metrics:JSON.parse(JSON.stringify(s.metrics)),overflows:s.overflows};if(!win||s.wave===8){s.done=true;log(win?'🏆 최종 승리!':'💀 패배')}else{s.wave++;s.energy+=Math.max(3,12-s.turn);s.units+=2;s.pick=true;s.enemyType=nextEnemy();s.sector=chooseSector();s.routes=generateRoutes();s.routePending=true;roll();log('웨이브 클리어! 보상을 선택하세요.')}render()}

function renderAnalysis(){const r=s.report;if(!r){$('analysis').textContent='전투 후 모듈별 피해·복제·에너지·발동 횟수를 비교할 수 있습니다.';return}const entries=Object.entries(r.metrics).filter(([k,v])=>v.activations||v.damage||v.clones||v.energy||v.power).sort((a,b)=>b[1].damage-a[1].damage);const max=Math.max(1,...entries.map(([k,v])=>v.damage));$('analysis').innerHTML='<b>'+(r.win?'승리':'패배')+' · '+r.wave+'웨이브 ('+r.enemy+') · '+r.turns+'턴 · 총 피해 '+r.damage+'</b><br>연쇄 이벤트 '+r.events+'회 · 최대 턴 연쇄 '+r.peak+'회'+(r.overflows?' · 제한 초과 '+r.overflows+'회':'')+entries.map(([k,v])=>'<div style="margin-top:9px">'+(M[k]?.[0]||'⚔️ 기본 공격')+' · 피해 '+v.damage+' · 복제 '+v.clones+' · 에너지 +'+v.energy+' · 발동 '+v.activations+'<div class="bar"><span style="width:'+Math.round(v.damage/max*100)+'%"></span></div></div>').join('')}function renderHints(){let arr=[];if(!s.slots.includes('mine'))arr.push('에너지 공급원이 없습니다.');if(s.slots.includes('clone')&&!s.slots.includes('mine'))arr.push('복제에 필요한 에너지를 보충하세요.');if(s.slots.includes('echo')||s.slots.includes('boost')){for(let i=0;i<s.slots.length;i++)if(['echo','boost'].includes(s.slots[i])&&(!s.slots[i-1]||['echo','boost'].includes(s.slots[i-1])))arr.push((i+1)+'번 증폭 슬롯 앞에 실행 가능한 모듈을 놓으세요.')}if(s.slots.includes('bomb')&&!s.slots.includes('revive'))arr.push('자폭에 재생을 연결하면 병사 소모를 줄일 수 있습니다.');if(s.slots.includes('onkill')||s.slots.includes('autoclone'))arr.push('처치 효과는 적이 죽을 때만 발동합니다.');if(!arr.length)arr.push('생산·복제·공격의 순서를 바꿔 피해와 연쇄 발동 횟수를 비교하세요.');$('hints').textContent=arr.join(' | ')}function renderRoutes(){$('routes').innerHTML=s.routePending?s.routes.map((r,i)=>'<button class="sector" onclick="chooseRoute('+i+')"><strong>'+SECTORS[r.sector].name+'</strong><small>'+r.objective.name+' — '+r.objective.desc+'</small><em>이 경로 선택</em></button>').join(''):'<div class="analysis">선택한 경로: '+s.sector.name+' · '+s.objective.name+'</div>'}function renderUpgrades(){$('upgrades').innerHTML='에너지 12로 공장 기능을 영구 강화합니다 (이번 게임 한정).<div>'+UPGRADES.map(u=>'<button onclick="buyUpgrade(\''+u.id+'\')" '+(s.playing||s.done||s.energy<12||s.upgrades[u.id]>=3?'disabled':'')+'>'+u.name+' Lv.'+s.upgrades[u.id]+'/3<small style="display:block">'+u.desc+'</small></button>').join('')+'</div>'}function renderMap(){const ranges=['1–3','4–6','7–8'];$('map').innerHTML=s.sector.lanes.map((l,i)=>'<div class="sector"><strong>'+['A','B','C'][i]+' · '+l[0]+'</strong><small>'+({mine:'해당 구역 채굴 에너지 +'+l[2],clone:'해당 구역 복제 생산 +'+l[2],attack:'모든 병사 공격력 강화',bomb:'해당 구역 자폭 피해 ×'+l[2],mutation:'해당 구역 변이 공격력 +'+l[2],recycle:'회수 모듈 에너지 +1',defense:'턴당 병사 손실 -1'}[l[1]])+'</small><em>연결 슬롯 '+ranges[i]+'</em></div>').join('')}function renderBattle(){const icons={standard:'🤖',jam:'🧬',drain:'🔋',armor:'🛡️',disrupt:'⏳',swarm:'👾'};const live=s.playing;const max=live?s.max:Math.round(35*Math.pow(1.85,s.wave-1)*(s.enemyType?.id==='swarm'?.75:1));const hp=live?s.hp:max;const shield=live?s.shield:(s.wave>=4?Math.round(s.wave*7):0);const initialShield=s.wave>=4?Math.round(s.wave*7):0;const displayShieldMax=Math.max(initialShield,shield,1);const shown=Math.min(15,s.units);$('clone-visual').innerHTML=Array.from({length:15},(_,i)=>'<div class="clone-token'+(i<shown?'':' empty')+'">'+(i<shown?'♟':'')+'</div>').join('');$('armycount').textContent='× '+s.units;$('armypower').textContent='병사당 공격력 '+s.attack;$('enemy-art').textContent=icons[s.enemyType?.id]||'🤖';$('enemy-name').textContent=s.enemyType?.name||'일반 코어';$('enemy-ability').textContent=s.enemyType?.desc||'기본 전투';$('battlehp').textContent=hp+' / '+max;$('hpfill').style.width=(100*hp/Math.max(1,max))+'%';$('battleshield').textContent=shield;$('shieldfill').style.width=(100*shield/displayShieldMax)+'%';$('battledamage').textContent='남은 필요 피해 '+(hp+shield);$('battleturns').textContent='턴 '+(live?s.turn:0)+' / '+(s.objective.id==='rush'?8:12);$('battlephase').textContent=s.done?(s.hp===0?'승리':'패배'):live?'전투 진행 중':s.routePending?'경로 선택 중':'전투 준비 중'}function renderGoal(){const live=s.playing;const max=live?s.max:Math.round(35*Math.pow(1.85,s.wave-1)*(s.enemyType?.id==='swarm'?.75:1));const shield=live?s.shield:(s.wave>=4?Math.round(s.wave*7):0);const hp=live?s.hp:max;const remaining=hp+shield;const done=live?max-hp:0;const limit=s.objective.id==='rush'?8:12;const turnsLeft=live?limit-s.turn:limit;const avg=live&&s.turn?Math.round(done/s.turn):0;const estimated=live&&s.turn?avg*turnsLeft:null;const estimate=estimated===null?'전투 시작 후 계산':estimated>=remaining?'현재 평균이면 승리 가능':'현재 평균이면 피해 부족';$('goal').innerHTML='<b>🎯 이번 웨이브 승리 목표</b><div class="goal-grid"><div class="goal-cell">기본 목표 체력<strong>'+max+'</strong></div><div class="goal-cell">남은 필요 피해<strong>'+remaining+'</strong></div><div class="goal-cell">이번 웨이브 누적 피해<strong>'+done+'</strong></div></div><div class="goal-bar"><span style="width:'+Math.max(0,Math.min(100,100*(max-hp)/max))+'%"></span></div><div class="goal-note">현재 체력 '+hp+' + 방어막 '+shield+' | 남은 턴 '+turnsLeft+'/'+limit+' | 평균 턴당 피해 '+avg+' | '+estimate+'</div><div class="goal-note">승리 조건: '+(s.objective.id==='rush'?'8턴 안에 적 격파':s.objective.id==='survive'?'10턴 이상 생존 후 적 격파':'12턴 안에 적 격파')+'. 방어막과 재생 때문에 필요한 총 피해는 증가할 수 있습니다. 예상치는 현재 평균에 기반한 참고값입니다.</div>'}function render(){$('reward-panel').classList.toggle('completed',!s.pick||s.done);$('reward-title').textContent=s.pick&&!s.done?'🎁 보상 선택 — 슬롯을 고른 후 모듈을 클릭하세요':'✓ 보상 선택 완료';$('modifier').textContent='지역: '+s.sector.name+' | 이번 적: '+(s.enemyType?.name||'일반 코어')+' — '+(s.enemyType?.desc||'기본 전투');$('startinfo').textContent='시작 조건: '+s.startName+' | 매 게임 시작 모듈과 초기 자원이 달라집니다.';$('stats').textContent='웨이브 '+s.wave+'/8 | 에너지 '+s.energy+' | 병사 '+s.units+' | 공격력 '+s.attack+' | 총 피해 '+s.total;$('slots').innerHTML=s.slots.map((k,i)=>'<button class="'+(i===s.selected?'selected':'')+'" onclick="choose('+i+')">'+(i+1)+'. '+(k?M[k][0]:'➕ 빈 슬롯')+'<small style="display:block">'+(k?M[k][1]:'보상 배치')+'</small></button>').join('');$('offers').innerHTML=s.pick&&!s.done?s.offers.map(k=>'<button onclick="pick(\''+k+'\')">'+M[k][0]+'<small style="display:block">'+M[k][1]+'</small></button>').join(''):'선택 완료';$('enemy').textContent=s.playing?'적 코어 HP '+s.hp+'/'+s.max+' · 방어막 '+s.shield+' · 턴당 병사 손실 '+s.enemyAttack:'다음 적: 웨이브 '+s.wave;$('state').textContent=s.done?(s.hp===0?'승리!':'게임 오버'):s.playing?'전투 진행 중':s.routePending?'다음 전투 지역을 선택하세요':s.pick?'모듈을 선택하세요':'전투 준비 완료';$('counts').textContent=Object.entries(s.counts).map(([k,n])=>M[k][0]+' ×'+n).join(' | ')||'전투 후 표시';$('start').disabled=s.pick||s.playing||s.done||s.routePending;$('reroll').disabled=!s.pick||s.playing||s.done||s.energy<6;renderAnalysis();renderHints();renderGoal();renderMap();renderRoutes();renderUpgrades();renderBattle()}function arrangeDashboard(){const root=$('dashboard');const main=document.createElement('div');main.className='dash-main';const side=document.createElement('div');side.className='dash-side';root.append(main,side);const wrap=(ids,cls,target)=>{const panel=document.createElement('section');panel.className='dash-panel '+(cls||'');if(cls==='reward-panel')panel.id='reward-panel';ids.forEach(id=>panel.append($(id)));target.append(panel);return panel};wrap(['reward-title','offers'],'reward-panel',main);wrap(['routes'],'',main).insertAdjacentHTML('afterbegin','<h3>🧭 다음 구역 선택</h3>');wrap(['slots'],'',main).insertAdjacentHTML('afterbegin','<h3>🏭 생산 슬롯 (클릭해 선택)</h3>');const controls=document.createElement('div');controls.className='dash-panel dash-actions';['start','reroll'].forEach(id=>controls.append($(id)));main.append(controls);const extras=document.createElement('div');extras.className='dash-panel';extras.append($('upgrade-details'),$('map-details'));main.append(extras);wrap(['stats'],'',side);const battlefield=document.querySelector('.battlefield');const battlePanel=document.createElement('section');battlePanel.className='dash-panel';battlePanel.append(battlefield);side.append(battlePanel);wrap(['goal'],'',side);const status=document.createElement('div');status.className='dash-panel';['state','modifier','startinfo','enemy'].forEach(id=>status.append($(id)));side.append(status);const details=document.createElement('div');details.className='dash-panel';document.querySelectorAll('details').forEach(el=>{if(!extras.contains(el))details.append(el)});side.append(details);const buttons=document.createElement('div');buttons.className='dash-actions';document.querySelectorAll('button[onclick^="move("],button[onclick="init()"]').forEach(el=>buttons.append(el));main.children[2].append(buttons);document.querySelectorAll('body>h3').forEach(el=>el.remove());}arrangeDashboard();init();</script></html>
