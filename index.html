<!doctype html><html lang="ko"><meta charset="utf-8"><title>Clone Human v2</title><style>body{background:#111827;color:#eee;font:16px system-ui;max-width:900px;margin:30px auto}button{padding:12px;background:#263953;color:white;border:1px solid #678;cursor:pointer;border-radius:8px;margin:3px}.selected{border:3px solid #6cf}#slots{display:grid;grid-template-columns:repeat(4,1fr)}#log{height:200px;overflow:auto;background:#223;padding:12px}</style><h1>🧬 CLONE HUMAN v2</h1><p>생산 순서와 이벤트 연쇄 반응으로 적 코어를 격파하세요.</p><h2 id="stats"></h2><div id="slots"></div><button onclick="move(-1)">◀ 왼쪽</button><button onclick="move(1)">오른쪽 ▶</button><button id="start" onclick="start()">전투 시작</button><button onclick="init()">새 게임</button><h3>보상 모듈</h3><div id="offers"></div><h3 id="enemy"></h3><p id="state"></p><h3>모듈 발동 횟수</h3><div id="counts"></div><h3>전투 기록</h3><div id="log"></div><script>
const M={mine:['⛏️ 채굴','에너지 +4'],clone:['🧬 복제','에너지 4 → 병사 2'],soldier:['🛡️ 훈련','에너지 3 → 병사 1'],echo:['⏳ 시간 복제','직전 모듈 2회 추가'],boost:['⚡ 증폭','직전 모듈 1회 추가'],bomb:['💣 자폭','병사 2명 소비, 피해 28'],recycle:['♻️ 회수','피해마다 에너지 +2'],mutation:['🧪 변이','에너지 5 → 공격력 +2'],onclone:['🔁 복제 반응','복제 시 추가 공격'],onkill:['💎 처치 회수','처치 시 에너지 +8'],autoclone:['🏭 자동 복제','처치 시 병사 2명'],revive:['💚 재생','자폭 시 병사 1명 복귀']};const $=id=>document.getElementById(id);let s,timer;
function log(x){$('log').textContent=x+'\n'+$('log').textContent}function roll(){s.offers=[];let keys=Object.keys(M);while(s.offers.length<3){let k=keys[Math.floor(Math.random()*keys.length)];if(!s.offers.includes(k))s.offers.push(k)}}
function init(){clearInterval(timer);s={wave:1,energy:8,units:2,attack:2,total:0,slots:['mine','clone','soldier',null,null,null,null,null],selected:3,pick:true,playing:false,done:false,turn:0,hp:1,max:1,counts:{},queue:[],processed:0};roll();$('log').textContent='';render()}
function choose(i){if(!s.playing){s.selected=i;render()}}function move(d){if(s.playing)return;let j=s.selected+d;if(j<0||j>=8)return;[s.slots[j],s.slots[s.selected]]=[s.slots[s.selected],s.slots[j]];s.selected=j;render()}
function pick(k){if(!s.pick||s.playing)return;s.slots[s.selected]=k;s.pick=false;render()}function event(kind,n=1){if(s.queue.length+s.processed<150)s.queue.push({kind,n})}
function act(k,i){if(!k)return;s.counts[k]=(s.counts[k]||0)+1;if(k==='mine')s.energy+=4;if(k==='clone'&&s.energy>=4){s.energy-=4;s.units+=2;event('clone',2)}if(k==='soldier'&&s.energy>=3){s.energy-=3;s.units++;event('clone',1)}if(k==='mutation'&&s.energy>=5){s.energy-=5;s.attack+=2}if(k==='bomb'){let n=Math.min(2,s.units);s.units-=n;if(n){event('damage',14*n);event('bomb',n)}}if((k==='echo'||k==='boost')&&i>0){let p=s.slots[i-1];if(p&&p!=='echo'&&p!=='boost')for(let j=0;j<(k==='echo'?2:1);j++)act(p,i-1)}}
function flush(){while(s.queue.length&&s.processed<150){let e=s.queue.shift();s.processed++;if(e.kind==='clone')for(let k of s.slots)if(k==='onclone'){s.counts[k]=(s.counts[k]||0)+1;event('damage',e.n*s.attack)}if(e.kind==='bomb')for(let k of s.slots)if(k==='revive'){s.counts[k]=(s.counts[k]||0)+1;s.units++}if(e.kind==='damage'){let dealt=Math.min(s.hp,e.n);s.hp-=dealt;s.total+=dealt;for(let k of s.slots)if(k==='recycle'){s.counts[k]=(s.counts[k]||0)+1;s.energy+=2}if(s.hp===0&&dealt>0)event('kill')}if(e.kind==='kill')for(let k of s.slots){if(k==='onkill'){s.counts[k]=(s.counts[k]||0)+1;s.energy+=8}if(k==='autoclone'){s.counts[k]=(s.counts[k]||0)+1;s.units+=2;event('clone',2)}}}s.queue=[]}
function tick(){s.turn++;s.queue=[];s.processed=0;s.counts={};let hp=s.hp;for(let i=0;i<8;i++){act(s.slots[i],i);flush()}event('damage',s.units*s.attack);flush();s.units=Math.max(0,s.units-Math.floor(s.wave/2)-1);log('턴 '+s.turn+': 피해 '+(hp-s.hp)+' · 병사 '+s.units+' · 에너지 '+s.energy+' · 이벤트 '+s.processed);if(!s.hp)return end(true);if(s.turn>=12)return end(false);render()}
function end(win){clearInterval(timer);s.playing=false;if(!win||s.wave===8){s.done=true;log(win?'🏆 최종 승리!':'💀 패배')}else{s.wave++;s.energy+=6;s.units+=2;s.pick=true;roll();log('웨이브 클리어! 보상을 선택하세요.')}render()}
function start(){if(s.pick||s.playing||s.done)return;s.max=35+20*s.wave*s.wave;s.hp=s.max;s.turn=0;s.playing=true;timer=setInterval(tick,450);render()}
function render(){$('stats').textContent='웨이브 '+s.wave+'/8 | 에너지 '+s.energy+' | 병사 '+s.units+' | 공격력 '+s.attack+' | 총 피해 '+s.total;$('slots').innerHTML=s.slots.map((k,i)=>'<button class="'+(i===s.selected?'selected':'')+'" onclick="choose('+i+')">'+(i+1)+'. '+(k?M[k][0]:'➕ 빈 슬롯')+'<small style="display:block">'+(k?M[k][1]:'보상 배치')+'</small></button>').join('');$('offers').innerHTML=s.pick&&!s.done?s.offers.map(k=>'<button onclick="pick(\''+k+'\')">'+M[k][0]+'<small style="display:block">'+M[k][1]+'</small></button>').join(''):'선택 완료';$('enemy').textContent=s.playing?'적 코어 HP '+s.hp+'/'+s.max:'다음 적: 웨이브 '+s.wave;$('state').textContent=s.done?(s.hp===0?'승리!':'게임 오버'):s.playing?'전투 진행 중':s.pick?'모듈을 선택하세요':'전투 준비 완료';$('counts').textContent=Object.entries(s.counts).map(([k,n])=>M[k][0]+' ×'+n).join(' | ')||'전투 후 표시';$('start').disabled=s.pick||s.playing||s.done}init();</script></html>
