<!doctype html><html lang="ko"><meta charset="utf-8"><title>Clone Human v2</title><style>body{background:#111827;color:#eee;font:16px system-ui;max-width:900px;margin:30px auto}button{padding:12px;background:#263953;color:white;border:1px solid #678;cursor:pointer;border-radius:8px;margin:3px}.selected{border:3px solid #6cf}#slots{display:grid;grid-template-columns:repeat(4,1fr)}#log{height:200px;overflow:auto;background:#223;padding:12px}.analysis{background:#1b2b3c;padding:14px;border-radius:12px;line-height:1.8}.bar{height:9px;background:#35445b;border-radius:8px;overflow:hidden}.bar span{display:block;background:#57c5d8;height:100%}#hints{background:#1b2b3c;padding:12px;border-radius:10px}#offers{display:flex;flex-wrap:wrap}button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:600px){body{margin:12px}#slots{grid-template-columns:repeat(2,1fr)}} </style><h1>🧬 CLONE HUMAN v2</h1><p>생산 순서와 이벤트 연쇄 반응으로 적 코어를 격파하세요.</p><h2 id="stats"></h2><div id="slots"></div><button onclick="move(-1)">◀ 왼쪽</button><button onclick="move(1)">오른쪽 ▶</button><button id="start" onclick="start()">전투 시작</button><button onclick="init()">새 게임</button><button id="reroll" onclick="reroll()">보상 새로고침 (에너지 6)</button><h3>보상 모듈</h3><div id="offers"></div><h3 id="enemy"></h3><div id="modifier" class="analysis"></div><div id="startinfo" class="analysis"></div><p id="state"></p><h3>모듈 발동 횟수</h3><div id="counts"></div><h3>📊 전투 분석</h3><div id="analysis" class="analysis">전투 후 모듈별 기여도가 표시됩니다.</div><h3>🧠 전략 정보</h3><div id="hints"></div><h3>전투 기록</h3><div id="log"></div><script>
const M={mine:['⛏️ 채굴','에너지 +4'],clone:['🧬 복제','에너지 4 → 병사 2'],soldier:['🛡️ 훈련','에너지 3 → 병사 1'],echo:['⏳ 시간 복제','직전 모듈 2회 추가'],boost:['⚡ 증폭','직전 모듈 1회 추가'],bomb:['💣 자폭','병사 2명 소비, 피해 28'],recycle:['♻️ 회수','피해마다 에너지 +2'],mutation:['🧪 변이','에너지 5 → 공격력 +2'],onclone:['🔁 복제 반응','복제 시 추가 공격'],onkill:['💎 처치 회수','처치 시 에너지 +8'],autoclone:['🏭 자동 복제','처치 시 병사 2명'],revive:['💚 재생','자폭 시 병사 1명 복귀']};const ENEMIES=[{id:'standard',name:'일반 코어',desc:'기본 전투'},{id:'jam',name:'복제 억제 코어',desc:'복제/훈련 비용 +2'},{id:'drain',name:'에너지 흡수 코어',desc:'매 턴 에너지 -3'},{id:'armor',name:'폭발 방어 코어',desc:'자폭 피해 60% 감소'},{id:'disrupt',name:'시간 교란 코어',desc:'시간 복제/증폭 추가 실행 -1'},{id:'swarm',name:'대량 공격 코어',desc:'매 턴 병사 손실 +2, 적 체력 -25%'}];const STARTS=[{name:'채굴 중심',slots:['mine','clone','soldier'],energy:8,units:2,attack:2},{name:'복제 중심',slots:['clone','mine','onclone'],energy:12,units:2,attack:2},{name:'자폭 중심',slots:['mine','soldier','bomb'],energy:9,units:4,attack:2},{name:'변이 중심',slots:['mine','mutation','soldier'],energy:10,units:2,attack:3},{name:'회수 중심',slots:['soldier','recycle','mine'],energy:7,units:3,attack:2}];const $=id=>document.getElementById(id);let s,timer;
function log(x){$('log').textContent=x+'\n'+$('log').textContent}function roll(){s.offers=[];let keys=Object.keys(M);while(s.offers.length<3){let k=keys[Math.floor(Math.random()*keys.length)];if(!s.offers.includes(k))s.offers.push(k)}}
function init(){clearInterval(timer);const st=STARTS[Math.floor(Math.random()*STARTS.length)];s={wave:1,energy:st.energy,units:st.units,attack:st.attack,total:0,slots:[...st.slots,null,null,null,null,null].slice(0,8),startName:st.name,enemyType:null,selected:3,pick:true,playing:false,done:false,turn:0,hp:1,max:1,counts:{},queue:[],processed:0,report:null,metrics:null,turnDamage:0,shield:0,enemyAttack:0,chainPeak:0,eventsTotal:0,overflows:0};s.enemyType=nextEnemy();roll();$('log').textContent='';render()}
function choose(i){if(!s.playing){s.selected=i;render()}}function move(d){if(s.playing)return;let j=s.selected+d;if(j<0||j>=8)return;[s.slots[j],s.slots[s.selected]]=[s.slots[s.selected],s.slots[j]];s.selected=j;render()}
function nextEnemy(){const candidates=ENEMIES.filter(e=>e.id!=='standard');return s.wave===1?ENEMIES[0]:candidates[Math.floor(Math.random()*candidates.length)]}function reroll(){if(s.playing||s.done||!s.pick||s.energy<6)return;s.energy-=6;roll();log('보상 새로고침: 에너지 6 소비');render()}function pick(k){if(!s.pick||s.playing)return;s.slots[s.selected]=k;s.pick=false;render()}function event(kind,n=1,source=''){if(s.queue.length+s.processed<120)s.queue.push({kind,n,source});else s.overflows++}
function act(k,i){if(!k)return;s.counts[k]=(s.counts[k]||0)+1;s.metrics[k].activations++;if(k==='mine'){s.energy+=4;s.metrics[k].energy+=4;}if(k==='clone'&&s.energy>=4+(s.enemyType?.id==='jam'?2:0)){s.energy-=4+(s.enemyType?.id==='jam'?2:0);s.units+=2;s.metrics[k].clones+=2;event('clone',2,k)}if(k==='soldier'&&s.energy>=3+(s.enemyType?.id==='jam'?2:0)){s.energy-=3+(s.enemyType?.id==='jam'?2:0);s.units++;s.metrics[k].clones++;event('clone',1,k)}if(k==='mutation'&&s.energy>=5){s.energy-=5;s.attack+=2;s.metrics[k].power+=2}if(k==='bomb'){let n=Math.min(2,s.units);s.units-=n;if(n){event('damage',Math.round(14*n*(s.enemyType?.id==='armor'?.4:1)),k);event('bomb',n,k)}}if((k==='echo'||k==='boost')&&i>0){let p=s.slots[i-1];if(p&&p!=='echo'&&p!=='boost')for(let j=0;j<Math.max(0,(k==='echo'?2:1)-(s.enemyType?.id==='disrupt'?1:0));j++)act(p,i-1)}}
function flush(){while(s.queue.length&&s.processed<120){let e=s.queue.shift();s.processed++;if(e.kind==='clone')for(let k of s.slots)if(k==='onclone'){s.counts[k]=(s.counts[k]||0)+1;s.metrics[k].activations++;event('damage',e.n*s.attack,k)}if(e.kind==='bomb')for(let k of s.slots)if(k==='revive'){s.counts[k]=(s.counts[k]||0)+1;s.metrics[k].activations++;s.metrics[k].clones++;s.units++}if(e.kind==='damage'){let absorbed=Math.min(s.shield,e.n);s.shield-=absorbed;let dealt=Math.min(s.hp,e.n-absorbed);s.hp-=dealt;s.total+=dealt;s.turnDamage+=dealt;if(e.source&&s.metrics[e.source])s.metrics[e.source].damage+=dealt;for(let k of s.slots)if(k==='recycle'){s.counts[k]=(s.counts[k]||0)+1;s.metrics[k].activations++;s.metrics[k].energy+=2;s.energy+=2}if(s.hp===0&&dealt>0)event('kill')}if(e.kind==='kill')for(let k of s.slots){if(k==='onkill'){s.counts[k]=(s.counts[k]||0)+1;s.metrics[k].activations++;s.metrics[k].energy+=8;s.energy+=8}if(k==='autoclone'){s.counts[k]=(s.counts[k]||0)+1;s.metrics[k].activations++;s.metrics[k].clones+=2;s.units+=2;event('clone',2,k)}}}s.eventsTotal+=s.processed;s.chainPeak=Math.max(s.chainPeak,s.processed);s.queue=[]}
function tick(){s.turn++;if(s.enemyType?.id==='drain')s.energy=Math.max(0,s.energy-3);s.queue=[];s.processed=0;s.counts={};s.turnDamage=0;let hp=s.hp;for(let i=0;i<8;i++){act(s.slots[i],i);flush()}event('damage',s.units*s.attack, 'basic');flush();if(s.hp>0){const lost=Math.min(s.units,s.enemyAttack);s.units-=lost;s.metrics.basic.losses+=lost;if(s.wave>=4&&s.turn%3===0){s.shield+=Math.ceil(s.wave*2.5);log('적 방어막 재생: +'+Math.ceil(s.wave*2.5));}}log('턴 '+s.turn+': 피해 '+s.turnDamage+' · 병사 '+s.units+' · 에너지 '+s.energy+' · 연쇄 '+s.processed);if(!s.hp)return end(true);if(s.turn>=12)return end(false);render()}
function end(win){clearInterval(timer);s.playing=false;s.report={win,wave:s.wave,enemy:s.enemyType?.name,turns:s.turn,damage:s.max-s.hp,events:s.eventsTotal,peak:s.chainPeak,metrics:JSON.parse(JSON.stringify(s.metrics)),overflows:s.overflows};if(!win||s.wave===8){s.done=true;log(win?'🏆 최종 승리!':'💀 패배')}else{s.wave++;s.energy+=Math.max(3,12-s.turn);s.units+=2;s.pick=true;s.enemyType=nextEnemy();roll();log('웨이브 클리어! 보상을 선택하세요.')}render()}
function start(){if(s.pick||s.playing||s.done)return;if(!s.enemyType)s.enemyType=nextEnemy();s.max=Math.round(35*Math.pow(1.85,s.wave-1)*(s.enemyType.id==='swarm'?.75:1));s.hp=s.max;s.shield=s.wave>=4?Math.round(s.wave*7):0;s.enemyAttack=Math.ceil(s.wave*0.85)+(s.enemyType.id==='swarm'?2:0);s.turn=0;s.playing=true;s.eventsTotal=0;s.chainPeak=0;s.overflows=0;s.metrics=Object.fromEntries([...Object.keys(M),'basic'].map(k=>[k,{activations:0,damage:0,clones:0,energy:0,power:0,losses:0}]));s.report=null;timer=setInterval(tick,450);render()}
function renderAnalysis(){const r=s.report;if(!r){$('analysis').textContent='전투 후 모듈별 피해·복제·에너지·발동 횟수를 비교할 수 있습니다.';return}const entries=Object.entries(r.metrics).filter(([k,v])=>v.activations||v.damage||v.clones||v.energy||v.power).sort((a,b)=>b[1].damage-a[1].damage);const max=Math.max(1,...entries.map(([k,v])=>v.damage));$('analysis').innerHTML='<b>'+(r.win?'승리':'패배')+' · '+r.wave+'웨이브 ('+r.enemy+') · '+r.turns+'턴 · 총 피해 '+r.damage+'</b><br>연쇄 이벤트 '+r.events+'회 · 최대 턴 연쇄 '+r.peak+'회'+(r.overflows?' · 제한 초과 '+r.overflows+'회':'')+entries.map(([k,v])=>'<div style="margin-top:9px">'+(M[k]?.[0]||'⚔️ 기본 공격')+' · 피해 '+v.damage+' · 복제 '+v.clones+' · 에너지 +'+v.energy+' · 발동 '+v.activations+'<div class="bar"><span style="width:'+Math.round(v.damage/max*100)+'%"></span></div></div>').join('')}function renderHints(){let arr=[];if(!s.slots.includes('mine'))arr.push('에너지 공급원이 없습니다.');if(s.slots.includes('clone')&&!s.slots.includes('mine'))arr.push('복제에 필요한 에너지를 보충하세요.');if(s.slots.includes('echo')||s.slots.includes('boost')){for(let i=0;i<s.slots.length;i++)if(['echo','boost'].includes(s.slots[i])&&(!s.slots[i-1]||['echo','boost'].includes(s.slots[i-1])))arr.push((i+1)+'번 증폭 슬롯 앞에 실행 가능한 모듈을 놓으세요.')}if(s.slots.includes('bomb')&&!s.slots.includes('revive'))arr.push('자폭에 재생을 연결하면 병사 소모를 줄일 수 있습니다.');if(s.slots.includes('onkill')||s.slots.includes('autoclone'))arr.push('처치 효과는 적이 죽을 때만 발동합니다.');if(!arr.length)arr.push('생산·복제·공격의 순서를 바꿔 피해와 연쇄 발동 횟수를 비교하세요.');$('hints').textContent=arr.join(' | ')}function render(){$('modifier').textContent='이번 적: '+(s.enemyType?.name||'일반 코어')+' — '+(s.enemyType?.desc||'기본 전투');$('startinfo').textContent='시작 조건: '+s.startName+' | 매 게임 시작 모듈과 초기 자원이 달라집니다.';$('stats').textContent='웨이브 '+s.wave+'/8 | 에너지 '+s.energy+' | 병사 '+s.units+' | 공격력 '+s.attack+' | 총 피해 '+s.total;$('slots').innerHTML=s.slots.map((k,i)=>'<button class="'+(i===s.selected?'selected':'')+'" onclick="choose('+i+')">'+(i+1)+'. '+(k?M[k][0]:'➕ 빈 슬롯')+'<small style="display:block">'+(k?M[k][1]:'보상 배치')+'</small></button>').join('');$('offers').innerHTML=s.pick&&!s.done?s.offers.map(k=>'<button onclick="pick(\''+k+'\')">'+M[k][0]+'<small style="display:block">'+M[k][1]+'</small></button>').join(''):'선택 완료';$('enemy').textContent=s.playing?'적 코어 HP '+s.hp+'/'+s.max+' · 방어막 '+s.shield+' · 턴당 병사 손실 '+s.enemyAttack:'다음 적: 웨이브 '+s.wave;$('state').textContent=s.done?(s.hp===0?'승리!':'게임 오버'):s.playing?'전투 진행 중':s.pick?'모듈을 선택하세요':'전투 준비 완료';$('counts').textContent=Object.entries(s.counts).map(([k,n])=>M[k][0]+' ×'+n).join(' | ')||'전투 후 표시';$('start').disabled=s.pick||s.playing||s.done;$('reroll').disabled=!s.pick||s.playing||s.done||s.energy<6;renderAnalysis();renderHints()}init();</script></html>
